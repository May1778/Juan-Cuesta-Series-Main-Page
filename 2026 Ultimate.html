    <script>
        const boton = document.getElementById("toggleNav");
        const wrapper = document.getElementById("menu-wrapper");

        boton.addEventListener("click", () => {
            wrapper.classList.toggle("activo");
            boton.textContent = wrapper.classList.contains("activo")
                ? "✖ CERRAR"
                : "☰ MENÚ";
        });


    </script>

    

    <script>
        const countDownDate = new Date("Dec 06, 2026 00:00:00").getTime();

        const x = setInterval(function () {

            const now = new Date().getTime();

            const distance = countDownDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("timer").innerHTML =
                `<span class="time-unit">${days}d</span> ` +
                `<span class="time-unit">${hours}h</span> ` +
                `<span class="time-unit">${minutes}m</span> ` +
                `<span class="time-unit">${seconds}s</span>`;

            if (distance < 0) {
                clearInterval(x);
                document.getElementById("timer").innerHTML = "EXPIRED";
            }
        }, 1000);
    </script>


</body>
